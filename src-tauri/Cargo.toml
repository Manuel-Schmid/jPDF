[package]
name = "juliepdf"
version = "1.0.2"
description = "JuliePDF PDF annotator"
authors = ["JuliePDF"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "juliepdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
png = "0.18"
base64 = "0.23"
tauri-plugin-clipboard-manager = "2"

# Same versions as Tauri's own WebView2 bindings (see Cargo.lock), used to enable touchpad pinch.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
lopdf = "0.47.0"
tempfile = "3.27.0"
chrono = "0.4.45"
uuid = { version = "1.29.3", features = ["v4"] }
flate2 = "1.1.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Runs the same checks a contributor runs locally (see AGENTS.md), on Windows
# because the app and its PDF backend only target Windows.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript (vitest + svelte-check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vitest run

  backend:
    name: Rust (clippy + cargo test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

name: Feature
description: A new feature or change, written so a person or a coding agent can implement it.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the user should be able to do afterwards, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. An issue moves to "Ready" only once these are written.
      placeholder: |
        - [ ] ...
        - [ ] Saved annotation looks the same in Acrobat / Edge
    validations:
      required: true
  - type: textarea
    id: area
    attributes:
      label: Likely files / area
      description: e.g. a new `src/tools/<tool>/`, `writer.rs`, the builder. Helps spot overlapping work.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
  - type: textarea
    id: performance
    attributes:
      label: Performance notes
      description: Does this touch drawing, page rendering, or add a dependency? How does it stay light?
